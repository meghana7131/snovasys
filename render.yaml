services:
  - type: web
    name: ledgerline-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: JAVA_OPTS
        value: "-Xmx384m"

databases:
  - name: ledgerline-db
    plan: free
    databaseName: ledgerline_db
    user: postgres

