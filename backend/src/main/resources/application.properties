spring.application.name=ledgerline
server.port=8080

# In-memory H2 by default (runs instantly without requiring local PostgreSQL setup)
# Overridden by environment variables in production / Docker / Render
spring.datasource.url=${DB_URL:jdbc:h2:mem:ledgerline_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
ledgerline.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
ledgerline.jwt.expiration-ms=86400000

# Invariant / System Baseline Constant
ledgerline.conservation.initial-pool=100000.00
