spring.application.name=ledgerline
server.port=8080

# PostgreSQL Configuration with Environment Variable Overrides
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security
ledgerline.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
ledgerline.jwt.expiration-ms=86400000

# Invariant / System Baseline
ledgerline.conservation.initial-pool=100000.00
