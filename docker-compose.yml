version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-postgres
    environment:
      POSTGRES_DB: ledgerline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledgerline-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgerline_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      JAVA_OPTS: "-Xmx384m"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

